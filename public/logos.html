<!-- Logo sprite. Inlined so the whole demo stays dependency-free and offline.

     Note the two Northwind marks: `logo-northwind` is the bank's real compass,
     `logo-northwind-fake` is the attacker's copy. The copy is deliberately
     ALMOST right — a slightly bluer gradient, a needle a hair off centre, a
     softer corner radius. That is what real phishing looks like, and anyone who
     spots it has learned the lesson the hard way round. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-pteri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb4ff"/><stop offset="1" stop-color="#b06eff"/>
    </linearGradient>
    <linearGradient id="g-northwind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="g-northwind-fake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5ad6"/><stop offset="1" stop-color="#0f93b4"/>
    </linearGradient>
  </defs>

  <!-- PTERI: a shield, signed. -->
  <symbol id="logo-pteri" viewBox="0 0 32 32">
    <path d="M16 2.4 27.2 7.4v9.3c0 6.7-4.5 11.8-11.2 14C9.3 28.5 4.8 23.4 4.8 16.7V7.4L16 2.4Z"
          fill="url(#g-pteri)"/>
    <path d="M10.4 17.4c2.7 3.1 4.6 3 6-.1 1.4-3.1 3.3-3.3 5.6-.4"
          fill="none" stroke="#0b0d12" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Northwind Bank: a compass needle pointing north. -->
  <symbol id="logo-northwind" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="9" fill="url(#g-northwind)"/>
    <path d="M16 5.8 20.4 17.7 16 15.2 11.6 17.7 16 5.8Z" fill="#fff"/>
    <path d="M16 26.2 11.6 18.9 16 21.3 20.4 18.9 16 26.2Z" fill="#fff" opacity=".42"/>
  </symbol>

  <!-- The attacker's copy of it. Close enough that nobody checks. -->
  <symbol id="logo-northwind-fake" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" fill="url(#g-northwind-fake)"/>
    <path d="M16.3 6.3 20.8 17.9 16.3 15.5 11.9 17.9 16.3 6.3Z" fill="#fff"/>
    <path d="M16.3 25.8 11.9 19 16.3 21.4 20.8 19 16.3 25.8Z" fill="#fff" opacity=".5"/>
  </symbol>

  <!-- The attacker: a connection intercepted in the middle. -->
  <symbol id="logo-attacker" viewBox="0 0 32 32">
    <path d="M4.5 16h7.2M20.3 16h7.2" stroke="#ff5f6b" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="3.6" fill="none" stroke="#ff5f6b" stroke-width="2.3"/>
  </symbol>

  <!-- A phone holding a key. Used on the wallet approval sheet. -->
  <symbol id="logo-wallet" viewBox="0 0 32 32">
    <rect x="8.5" y="3.5" width="15" height="25" rx="4"
          fill="none" stroke="url(#g-pteri)" stroke-width="2.2"/>
    <circle cx="16" cy="14.2" r="3.1" fill="none" stroke="url(#g-pteri)" stroke-width="2.2"/>
    <path d="M16 17.3v5.4m0-2.2h2.4" stroke="url(#g-pteri)" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
</svg>
